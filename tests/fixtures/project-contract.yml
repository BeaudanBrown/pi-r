contractVersion: 1
templateVersion: pi-r-template-v1
policyVersion: pi-r-policy-v1
project:
  name: confidential-analysis
  nixpkgs:
    owner: NixOS
    repo: nixpkgs
    rev: b6018f87da91d19d0ab4cf979885689b469cdd41
    narHash: sha256-twXPFqFsrrY5r28Zh7Homgcp2gUMBgQ6WDS98Q/3xFI=
    lastModified: 1782847189
dependencies:
  - data.table
constants:
  input_path: data/input.qs
  threshold: 0.5
  output_path: artifacts/report.qs
functions:
  - name: load_input
    parameters: [path]
    purpose: Load the approved input table
    requirements:
      - Return a data.table without changing the input path
    behaviorReview: &complete_review
      input-shape: Input shape is specified by the function parameters and requirements
      missing-values: Preserve missing values unless a requirement states otherwise
      duplicates: Not applicable; this function does not resolve duplicate records
      numeric-parsing: Not applicable; this function does not parse numeric values
      categorical-coding: Not applicable; this function does not assign categorical meaning
      cohort: Not applicable; this function does not select a cohort
      joins: Not applicable; this function does not join inputs
      events-time: Not applicable; this function does not derive events or time
      output-schema: Output artifact kind and required result are specified
      ordering-uniqueness: Preserve input ordering; no uniqueness claim is made
      side-effects: Do not mutate the input path
    behaviorEvidence: &fixture_evidence
      - kind: project-policy
        reference: Deterministic fixture specification
    behaviorDecisions: &fixture_decisions
      missingValues:
        policy: Preserve missing values unless a requirement states otherwise
        tokens: []
      output:
        columnPolicy: Preserve all columns required by the function requirement
        columns: []
        key: []
        ordering: Preserve deterministic input order
  - name: make_config
    parameters: [threshold]
    purpose: Construct the analysis configuration
    requirements:
      - Preserve threshold as a finite scalar
    behaviorReview: *complete_review
    behaviorEvidence: *fixture_evidence
    behaviorDecisions: *fixture_decisions
  - name: summarise_groups
    parameters: [input, config]
    purpose: Produce the approved grouped summaries
    requirements:
      - Return a data.table with deterministic grouping
    behaviorReview: *complete_review
    behaviorEvidence: *fixture_evidence
    behaviorDecisions: *fixture_decisions
  - name: write_result
    parameters: [table, config, output_path]
    purpose: Write the approved summary artifact
    requirements:
      - Write only output_path and return that exact path
    behaviorReview: *complete_review
    behaviorEvidence: *fixture_evidence
    behaviorDecisions: *fixture_decisions
targets:
  - name: raw_data
    function: load_input
    artifact: table
    arguments:
      path:
        constant: input_path
  - name: config
    function: make_config
    artifact: object
    arguments:
      threshold:
        constant: threshold
  - name: summaries
    function: summarise_groups
    artifact: table
    arguments:
      input:
        target: raw_data
      config:
        target: config
    pattern:
      kind: map
      over: [raw_data]
  - name: report
    function: write_result
    artifact: file
    arguments:
      table:
        target: summaries
      config:
        target: config
    output:
      parameter: output_path
      constant: output_path
    pattern:
      kind: cross
      over: [summaries, config]
